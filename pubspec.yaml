name: smilecheck
description: AI-based dental caries detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  intl: ^0.19.0
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/test_caries/
    - assets/test_healthy/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"
  adaptive_icon_background: "#EBF4FB"
  adaptive_icon_foreground: "assets/images/logo.jpeg"
  web:
    generate: false
  windows:
    generate: false